name: Publish to PyPI

# * Triggered by pushing a version tag (e.g. v0.1.0, v1.2.3).
# * Uses PyPI Trusted Publishing (OIDC) — NO long-lived PYPI_TOKEN, nothing to rotate.
# * Unlike npm, PyPI supports a "pending publisher": you can configure the trusted
# *   publisher BEFORE the first release, so no bootstrap-token publish is needed.
# *   On pypi.org: Account/Project → Publishing → Add a GitHub Actions publisher →
# *   owner=<org>, repo=<repo>, workflow=publish.yml, environment=pypi.

on:
  push:
    tags:
      - 'v*'

jobs:
  # * Release gate: a tag publishes only a commit that reached main through a merged pull
  #   request and passed CI there. Tags are admin-only and immutable (repository rulesets);
  #   this job refuses a tag put on any other commit, so review happens on the pull request.
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tagged commit is on main and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main. Release only commits merged into main."
            exit 1
          fi
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::CI has not passed on $GITHUB_SHA. Wait for it on main, then push the tag again."
            exit 1
          fi
          echo "$GITHUB_REF_NAME -> $GITHUB_SHA: on main, CI passed."

  build:
    name: Build sdist + wheel
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build distributions
        run: python -m pip install --upgrade build && python -m build

      - name: Twine check
        run: python -m pip install --upgrade twine && python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (OIDC trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    # * A GitHub Environment named "pypi" lets you add release protection rules
    #   (required reviewers, tag restrictions) and is the conventional pairing
    #   with a PyPI trusted publisher scoped to that environment.
    environment:
      name: pypi
      url: https://pypi.org/p/mywebapi-sdk
    permissions:
      # ! Required for OIDC trusted publishing — mints the short-lived id-token
      #   PyPI verifies. No API token is stored anywhere.
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        # * No password/token input: the action exchanges the workflow's OIDC
        #   id-token for a short-lived PyPI upload credential.
        uses: pypa/gh-action-pypi-publish@release/v1
