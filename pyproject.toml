[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# * PyPI distribution name (https://pypi.org/project/mywebapi-sdk/), first released as
#   0.3.0 on 30.09.2026; versions move together with the JS, .NET and PowerShell SDKs.
name = "mywebapi-sdk"
version = "0.3.0"
description = "Python client for the MyWebAPI.com trading platform management API (v2). Generated endpoints + httpx ergonomic layer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mywebapi", "trading-platform", "trading", "broker", "forex", "webapi", "sdk", "httpx", "signalr"]
authors = [{ name = "CPlugin" }]
dependencies = [
  "httpx>=0.27,<1",
  "attrs>=23.1",
  "python-dateutil>=2.8",
  "pydantic>=2.6,<3",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
# * Codegen toolchain — dev-only. Pinned for reproducible output.
# ! 0.21.7 crashes on Python 3.14 (typer/click incompatibility); 0.29.0 is the earliest working pin.
codegen = ["openapi-python-client==0.29.0"]
# * Real-time SignalR streaming — community library, optional, EXPERIMENTAL.
# ! No official Python SignalR client exists; signalrcore wraps the protocol.
signalr = ["signalrcore>=0.9.5"]

[project.urls]
Homepage = "https://github.com/CPlugin/mywebapi.com-sdk-py"
Repository = "https://github.com/CPlugin/mywebapi.com-sdk-py"
Issues = "https://github.com/CPlugin/mywebapi.com-sdk-py/issues"
Changelog = "https://github.com/CPlugin/mywebapi.com-sdk-py/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/cplugin_webapi_sdk"]
# * The vendored OpenAPI spec (~0.9 MB) is a codegen input, not needed at runtime;
#   it stays in the sdist so the generated layer can be rebuilt from it.
exclude = ["src/cplugin_webapi_sdk/spec"]
